name: build-image

on:
  workflow_dispatch:
    inputs:
      pyslam_ref:
        description: 'pyslam git ref (commit SHA / tag / branch)'
        required: false
        default: 'a5ff2562eb929ed9a08420f528a120a3cca65585'
        type: string
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/build-image.yml'
  schedule:
    - cron: '0 18 * * 1'  # Mondays 18:00 UTC (Tue 02:00 CST): refresh base image

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYSLAM_REF_DEFAULT: 'a5ff2562eb929ed9a08420f528a120a3cca65585'  # pyslam master tip (full SHA required), pinned for reproducibility

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (the image is large)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
                       /usr/local/julia* /usr/local/clang* /usr/local/graalpy \
                       /home/linuxbrew /.dotnet /usr/local/share/boost /usr/share/kotlinc 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h / /mnt

      - name: Add swap (Eigen/nvcc TUs at -j4 OOM-killed the runner once)
        run: |
          free -h
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h && swapon --show

      - name: Compute image name (must be lowercase for ghcr.io)
        id: image
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- step 1: bank the expensive python/opencv/pip phases as :builder ----
      # Even if the full build later fails, phases 1-2 stay cached in the
      # registry (image + buildcache), so retries skip ~2.5 h of work.
      - name: Build and push builder stage (phases 1-2)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: base
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            PYSLAM_REF=${{ github.event.inputs.pyslam_ref || env.PYSLAM_REF_DEFAULT }}
          tags: ${{ steps.image.outputs.image }}:builder
          cache-from: type=registry,ref=${{ steps.image.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.image }}:buildcache,mode=max

      - name: Docker metadata (final tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=cu128-skylake,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # ---- step 2: full image; phases 1-2 are cache hits (local builder + registry)
      - name: Build and push (full)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            PYSLAM_REF=${{ github.event.inputs.pyslam_ref || env.PYSLAM_REF_DEFAULT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.image }}:buildcache,mode=max

      - name: Smoke test (CPU-side import check on the pushed digest)
        run: |
          docker run --rm "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}" python -c "import sys, torch, cv2, detectron2; assert sys.version_info[:2] == (3, 11), sys.version; assert torch.version.cuda and torch.version.cuda.startswith('12'), torch.version.cuda; print('smoke ok:', sys.version.split()[0], torch.__version__, torch.version.cuda, cv2.__version__, torch.cuda.get_arch_list())"
